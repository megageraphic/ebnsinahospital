<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات الطبية - مستشفى ابن سينا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
        }

        header {
            background-color: #0056b3;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        .header-title img {
            width: 35px;
            height: 35px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #ffe6e6;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px 50px 20px;
        }

        .page-title {
            text-align: center;
            color: #0056b3;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 800;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .back-btn-container {
            text-align: center;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background-color: white;
            color: #0056b3;
            border: 2px solid #0056b3;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .back-btn i {
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #e60000;
            color: white;
            border-color: #e60000;
            box-shadow: 0 6px 20px rgba(230, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .lightbox.show {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 85vh;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .close-lightbox {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-lightbox:hover {
            color: #e60000;
        }

        /* ==========================================
           تنسيقات الفوتر المستقلة
           ========================================== */
        footer.custom-site-footer {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: wrap !important;
            gap: 15px !important;
            padding: 15px 30px !important;
            background-color: #ffffff !important;
            border-top: 1px solid #e9ecef !important;
            direction: rtl !important;
            box-sizing: border-box !important;
            width: 100% !important;
            margin-top: 40px !important;
        }

        footer.custom-site-footer p.custom-footer-copy {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 14px !important;
            color: #495057 !important;
        }

        footer.custom-site-footer .custom-footer-credits {
            display: inline-flex !important;
            align-items: center !important;
            gap: 10px !important;
            font-size: 14px !important;
            color: #495057 !important;
        }

        footer.custom-site-footer .custom-footer-logo {
            height: 30px !important;
            width: auto !important;
            max-height: 30px !important;
            object-fit: contain !important;
            vertical-align: middle !important;
        }

        footer.custom-site-footer .custom-footer-btn {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 35px !important;
            height: 35px !important;
            border-radius: 50% !important;
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 16px !important;
            transition: transform 0.2s ease, opacity 0.2s ease !important;
        }

        footer.custom-site-footer .custom-footer-btn.phone-btn {
            background-color: #0d6efd !important;
        }

        footer.custom-site-footer .custom-footer-btn.whatsapp-btn {
            background-color: #25d366 !important;
        }

        footer.custom-site-footer .custom-footer-btn:hover {
            opacity: 0.85 !important;
            transform: translateY(-2px) !important;
        }

        @media (max-width: 576px) {
            footer.custom-site-footer {
                justify-content: center !important;
                text-align: center !important;
                flex-direction: column !important;
                padding: 15px !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <img src="Logo HD.png" alt="شعار مستشفى ابن سينا">
            <span>مستشفى ابن سينا</span>
        </div>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> الصفحة الرئيسية</a>
    </header>

    <div class="container">
        <h1 class="page-title"><i class="fa-solid fa-user-doctor"></i> معـرض الخدمات الطبية</h1>
        
        <!-- الحاوية التي سيتم إضافة الصور إليها من 71.png إلى 85.png -->
        <div class="gallery-grid" id="galleryGrid"></div>

        <div class="back-btn-container">
            <a href="home.html" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i>
                <span>الرجوع للخلف</span>
            </a>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <i class="fa-solid fa-xmark close-lightbox" id="closeLightbox"></i>
            <img id="lightboxImg" src="" alt="عرض مكبر">
        </div>
    </div>

    <!-- بداية الفوتر -->
    <footer class="custom-site-footer">
        <p class="custom-footer-copy">&copy; جميع الحقوق محفوظة - مستشفى ابن سينا</p>
        <div class="custom-footer-credits">
            <span>تصميم بواسطة</span>
            <img src="100.png" alt="شعار التصميم" class="custom-footer-logo">
            <a href="tel:01010255123" class="custom-footer-btn phone-btn" title="اتصال هاتفي" target="_blank" rel="noopener">
                <i class="fa-solid fa-phone"></i>
            </a>
            <a href="https://wa.me/201010255123" class="custom-footer-btn whatsapp-btn" title="مراسلة عبر الواتساب" target="_blank" rel="noopener">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>
    </footer>
    <!-- نهاية الفوتر -->

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const galleryGrid = document.getElementById("galleryGrid");
            const lightbox = document.getElementById("lightbox");
            const lightboxImg = document.getElementById("lightboxImg");
            const closeLightbox = document.getElementById("closeLightbox");

            // تعديل الحلقة للبدء من 71.png إلى 85.png
            for (let i = 71; i <= 85; i++) {
                const imgPath = `ibn sina2/${i}.png`;
                
                const item = document.createElement("div");
                item.className = "gallery-item";
                item.innerHTML = `<img src="${imgPath}" alt="خدمات طبية ${i}" loading="lazy">`;
                
                item.addEventListener("click", function() {
                    lightboxImg.src = imgPath;
                    lightbox.classList.add("show");
                });

                galleryGrid.appendChild(item);
            }

            closeLightbox.addEventListener("click", () => lightbox.classList.remove("show"));
            lightbox.addEventListener("click", (e) => {
                if (e.target === lightbox) lightbox.classList.remove("show");
            });
        });
    </script>
</body>
</html>
